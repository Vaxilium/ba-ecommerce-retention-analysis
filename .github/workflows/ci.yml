name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Full pipeline (generate -> warehouse -> analysis -> analytics -> docs)
        run: make all
